services:
  - type: web
    name: omnigpt
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: API_PIN
        value: ""
      - key: LLM_ENDPOINT_URL
        value: ""
      - key: LLM_MODEL
        value: "qwen2.5:14b-instruct-q4_K_M"
      - key: LLM_API_KEY
        value: ""
